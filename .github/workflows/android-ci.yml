name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The repository ships gradle/wrapper/gradle-wrapper.properties but not the
      # binary jar, so Gradle is installed here and the wrapper is generated.
      - name: Install Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Upload the Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn

      - name: Run the unit tests (reading logic, no device needed)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build the debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

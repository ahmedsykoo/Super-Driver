name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Accept Android SDK licences
        continue-on-error: true
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          else
            echo "sdkmanager not found, continuing"
          fi

      # The repository ships gradle/wrapper/gradle-wrapper.properties but not the
      # binary jar, so Gradle is installed here and the wrapper is generated.
      - name: Install Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build and test
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "### gradle :app:testDebugUnitTest"
            gradle --no-daemon :app:testDebugUnitTest
            echo "### testExit=$?"
            echo
            echo "### gradle :app:assembleDebug"
            gradle --no-daemon :app:assembleDebug
            echo "### assembleExit=$?"
          } 2>&1 | tee ci-logs/build.log

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p ci-logs
          cp app/build/test-results/testDebugUnitTest/*.xml ci-logs/ 2>/dev/null || true
          ls ci-logs

      - name: Publish the build log on the branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          if git diff --cached --quiet; then
            echo "no log to publish"
          else
            git commit -m "ci: publish build log for run ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail the job when the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK and test report
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

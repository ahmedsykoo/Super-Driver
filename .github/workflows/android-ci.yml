name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Accept Android SDK licences
        continue-on-error: true
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          else
            echo "sdkmanager not found, continuing"
          fi

      # The binary wrapper jar cannot be generated offline, so it is created
      # here once and committed back to the branch.
      - name: Generate the Gradle wrapper when it is missing
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper already present"
            exit 0
          fi
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          "$HOME/gradle-dist/gradle-8.7/bin/gradle" wrapper --gradle-version 8.7 --distribution-type bin

      - name: Commit the generated Gradle wrapper
        run: |
          if [ -z "$(git status --porcelain gradlew gradlew.bat gradle/wrapper)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "ci: add the Gradle wrapper [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build and test
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x ./gradlew
          mkdir -p ci-logs
          {
            ./gradlew --no-daemon :app:testDebugUnitTest
            echo "### testExit=$?"
            echo
            ./gradlew --no-daemon :app:assembleDebug
            echo "### assembleExit=$?"
          } 2>&1 | tee ci-logs/build.log

      # Only on failure: the build log is published on the branch so it can be
      # inspected even when artifacts are not accessible.
      - name: Publish the build log
        if: failure()
        run: |
          mkdir -p ci-logs
          cp app/build/test-results/testDebugUnitTest/*.xml ci-logs/ 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          if git diff --cached --quiet; then
            echo "no log to publish"
          else
            git commit -m "ci: publish build log for run ${GITHUB_RUN_ID} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail the job when the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK and test report
        uses: actions/upload-artifact@v5
        with:
          name: super-driver-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

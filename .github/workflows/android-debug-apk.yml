name: Build debug APK

# Builds 04-android-project and uploads the debug APK as a workflow artifact.
# The project is unbuilt/untested on a device (see 04-android-project/README.md) —
# this workflow is the first thing that actually compiles it.
#
# For a working login in the built APK, add two repo secrets first:
# Settings -> Secrets and variables -> Actions -> New repository secret
#   SUPABASE_URL          = https://nmikjuyjcjyjmuqiacvl.supabase.co
#   SUPABASE_ANON_KEY     = (the sb_publishable_... key)

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform and build-tools
        # ubuntu-latest already ships an Android SDK (ANDROID_HOME is preset) — using it
        # directly instead of android-actions/setup-android@v3, which fails trying to
        # install the long-removed legacy "tools" package.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Write Supabase credentials
        # Pulled from repo secrets (Settings -> Secrets and variables -> Actions),
        # never committed. Missing secrets just produce an empty local.properties —
        # the build still succeeds, login just won't work in that APK (see build.gradle.kts).
        working-directory: 04-android-project
        run: |
          echo "supabaseUrl=${SUPABASE_URL}" > local.properties
          echo "supabaseAnonKey=${SUPABASE_ANON_KEY}" >> local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Set up Gradle
        # The repo's own gradlew wrapper jar/script were never generated, so this
        # action provides Gradle 8.9 directly (matching gradle-wrapper.properties)
        # instead of relying on ./gradlew.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: 04-android-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-driver-debug-apk
          path: 04-android-project/app/build/outputs/apk/debug/*.apk
